<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ideas · anotetoself</title>
<meta name="description" content="Idea board: track every research idea from first spark to done." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 8 C9 5.5 13 5.5 16 8.5 C19 5.5 23 5.5 28 8 V26 C23 23.5 19 23.5 16 26.5 C13 23.5 9 23.5 4 26 Z M16 8.5 V26.5' fill='%23dff25b' stroke='%231b1b1b' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/journal.css" />
</head>
<body>

<main class="wrap" id="page" data-page="ideas">

  <section class="hero">
    <div>
      <span class="eyebrow">Idea board</span>
      <h1 class="display">Deep research starts with a single <em class="hl">spark</em>.</h1>
      <p class="lede">Catch the idea now, then follow it below the surface: questions, notes, sources, results.</p>
      <form class="new-idea" id="newIdeaForm" autocomplete="off">
        <label for="newTitle" class="sr-only">Idea</label>
        <input class="input" id="newTitle" maxlength="120" placeholder="What if…" required />
        <div class="row">
          <label for="newTags" class="sr-only">Tags</label>
          <input class="input" id="newTags" maxlength="120" placeholder="tags, comma separated" />
          <button type="submit" class="btn" id="newIdeaBtn">Add to board</button>
        </div>
      </form>
    </div>
    <div class="hero-art" data-art="diver"></div>
  </section>

  <div class="toolbar board-tools">
    <label class="search">
      <svg width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr-only">Search ideas</span>
      <input type="search" id="ideaSearch" placeholder="Search ideas, notes, tags…" />
    </label>
    <span class="pill" id="ideaCount"></span>
  </div>
  <div class="chips" id="tagChips" style="margin-top:14px" aria-label="Filter by tag"></div>

  <div class="board" id="board" aria-label="Ideas by status"></div>
  <p class="fine" style="text-align:center">Drag cards between columns, or use the ‹ › arrows.</p>
</main>

<script src="assets/core.js"></script>
<script src="assets/ideas.js"></script>
</body>
</html>
