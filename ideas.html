<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ideas · anotetoself research journal</title>
<meta name="description" content="Idea board: track every research idea from first spark to done." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L14.8 8.6 L22 9.3 L16.5 14 L18.2 21 L12 17.3 L5.8 21 L7.5 14 L2 9.3 L9.2 8.6Z' fill='%23f5d6a0' stroke='%232b2b2b' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/journal.css" />
</head>
<body>

<main class="page" id="page" data-page="ideas" data-title="IDEA BOARD">

  <section class="card sketch press new-idea" aria-labelledby="newIdeaTitle">
    <h2 id="newIdeaTitle">catch a new idea ✦</h2>
    <form id="newIdeaForm" autocomplete="off">
      <label class="grow">
        <span class="sr-only">Idea</span>
        <input class="line-input" id="newTitle" maxlength="120" placeholder="what if…" required />
      </label>
      <label class="tags-field">
        <span class="sr-only">Tags</span>
        <input class="line-input" id="newTags" maxlength="120" placeholder="#tags, comma separated" />
      </label>
      <button type="submit" class="btn sketch press" id="newIdeaBtn">add to board 💡</button>
    </form>
  </section>

  <div class="toolbar board-tools">
    <label class="search">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr-only">Search ideas</span>
      <input type="search" id="ideaSearch" placeholder="search ideas, notes, tags…" />
    </label>
    <span class="pill" id="ideaCount"></span>
  </div>
  <div class="chips" id="tagChips" style="margin-top:12px" aria-label="Filter by tag"></div>

  <div class="board" id="board" aria-label="Ideas by status"></div>
  <p class="muted" style="text-align:center;margin:6px 0 0">drag cards between columns, or use the ‹ › arrows</p>
</main>

<script src="assets/core.js"></script>
<script src="assets/ideas.js"></script>
</body>
</html>
