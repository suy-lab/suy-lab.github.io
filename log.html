<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log · anotetoself</title>
<meta name="description" content="Research log: every timestamped note, searchable and linked to your ideas." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 8 C9 5.5 13 5.5 16 8.5 C19 5.5 23 5.5 28 8 V26 C23 23.5 19 23.5 16 26.5 C13 23.5 9 23.5 4 26 Z M16 8.5 V26.5' fill='%23dff25b' stroke='%231b1b1b' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/journal.css" />
</head>
<body>

<main class="wrap" id="page" data-page="log">

  <section class="hero">
    <div>
      <span class="eyebrow">Research log</span>
      <h1 class="display">Where I'm <em class="hl">at</em>, one day at a time.</h1>
      <p class="lede">What you tried, read and noticed, timestamped and searchable. Tag an entry with an idea and it shows up in that idea's file.</p>
    </div>
    <div class="hero-art small" data-art="writer"></div>
  </section>

  <div class="split">
    <div class="sticky">
      <form class="card" id="logForm" autocomplete="off">
        <h2>Log it</h2>
        <label for="logText" class="sr-only">New log entry</label>
        <textarea class="textarea" id="logText" maxlength="2000" placeholder="What happened? What did you try, read, notice?"></textarea>
        <div class="moods" role="group" aria-label="Mood (optional)" style="margin:14px 0">
          <span class="lbl">Mood</span>
          <button type="button" class="mood" data-mood="🙂" aria-pressed="false" aria-label="good">🙂</button>
          <button type="button" class="mood" data-mood="😌" aria-pressed="false" aria-label="calm">😌</button>
          <button type="button" class="mood" data-mood="😵‍💫" aria-pressed="false" aria-label="overwhelmed">😵‍💫</button>
          <button type="button" class="mood" data-mood="😴" aria-pressed="false" aria-label="tired">😴</button>
          <button type="button" class="mood" data-mood="🔥" aria-pressed="false" aria-label="motivated">🔥</button>
        </div>
        <label class="field-label" for="logIdea" style="margin-top:0">About an idea <small>(optional)</small></label>
        <select class="select" id="logIdea"></select>
        <div class="compose-foot">
          <span class="hint"><kbd>ctrl</kbd> + <kbd>enter</kbd> to save</span>
          <button type="submit" class="btn" id="logBtn">Save entry</button>
        </div>
      </form>

      <section class="card" aria-label="Filters">
        <h2>Find <em>things</em></h2>
        <label class="search">
          <svg width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="sr-only">Search the log</span>
          <input type="search" id="logSearch" placeholder="Search the log…" />
        </label>
        <span class="field-label">Month</span>
        <div class="chips" id="monthChips"></div>
        <label class="field-label" for="filterIdea">Idea</label>
        <select class="select" id="filterIdea"></select>
      </section>
    </div>

    <article class="card" aria-labelledby="logTitle">
      <div class="card-head">
        <h2 id="logTitle">Timeline</h2>
        <span class="pill" id="logCount"></span>
      </div>
      <div id="logGroups" aria-live="polite"></div>
    </article>
  </div>
</main>

<script src="assets/core.js"></script>
<script src="assets/log.js"></script>
</body>
</html>
