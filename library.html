<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>library · anotetoself research journal</title>
<meta name="description" content="Reading library: papers, books and links with notes, linked to your ideas." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2 L14.8 8.6 L22 9.3 L16.5 14 L18.2 21 L12 17.3 L5.8 21 L7.5 14 L2 9.3 L9.2 8.6Z' fill='%23f5d6a0' stroke='%232b2b2b' stroke-width='1.6'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Patrick+Hand&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/journal.css" />
</head>
<body>

<main class="page" id="page" data-page="library" data-title="READING LIBRARY">
  <div class="split">
    <div class="sticky">
      <section class="card sketch press add-source" aria-labelledby="addTitle">
        <h2 id="addTitle">add to the shelf 📚</h2>
        <form id="sourceForm" autocomplete="off">
          <label><span>title *</span><input class="line-input" id="srcTitle" maxlength="200" required placeholder="paper, book, video, article…" /></label>
          <label><span>authors</span><input class="line-input" id="srcAuthors" maxlength="200" placeholder="Lastname et al." /></label>
          <div class="row">
            <label><span>year</span><input class="line-input" id="srcYear" maxlength="10" inputmode="numeric" placeholder="2024" /></label>
            <label><span>tags</span><input class="line-input" id="srcTags" maxlength="120" placeholder="#focus, #sleep" /></label>
          </div>
          <label><span>link</span><input class="line-input" id="srcUrl" maxlength="500" placeholder="https://…" /></label>
          <label><span>for idea</span><select class="select" id="srcIdea" style="width:100%"></select></label>
          <div style="text-align:right;margin-top:6px"><button type="submit" class="btn sketch press" id="srcBtn">shelve it ★</button></div>
        </form>
      </section>
    </div>

    <section aria-label="Sources">
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
          <span class="sr-only">Search the library</span>
          <input type="search" id="libSearch" placeholder="search titles, authors, notes…" />
        </label>
      </div>
      <div class="chips" id="statusChips" style="margin-top:12px" aria-label="Filter by status"></div>
      <div class="lib-list" id="libList"></div>
    </section>
  </div>
</main>

<script src="assets/core.js"></script>
<script src="assets/library.js"></script>
</body>
</html>
